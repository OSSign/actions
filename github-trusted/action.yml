name: Trusted Token
description: "Configure and get a trusted token for external systems that need a custom id-token for use in Github Actions. Requires id-token: write"
author: OSSign

branding:
  icon: user-check
  color: green

inputs:
  token:
    description: 'GitHub token with id-token: write access'
    required: true
  
  audience:
    description: 'The audience for the trusted token'
    required: true

  exchange:
    description: 'The exchange endpoint for the trusted token'
    required: true

outputs:
  trusted_token:
    description: 'The trusted token obtained from the exchange'

runs:
  using: composite
  steps:
    - name: Get Trusted Token
      shell: bash
      run: |
        echo "Getting a trusted token..."
        set -euo pipefail

        # urlencoded audience
        AUDIENCE="${{ inputs.audience }}"
        ENCODED_AUDIENCE=$(python3 -c "import urllib.parse; print(urllib.parse.quote('''$AUDIENCE'''))")
        
        ID_TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$ENCODED_AUDIENCE" | jq -r .value)

        echo "::add-mask::$ID_TOKEN"

        echo "Exchanging ID token for trusted token..."

        TOKEN=$(curl -sSf -X POST -H "Authorization: Bearer $ID_TOKEN" "${{ inputs.exchange }}" | jq -r .token)
        
        if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then echo "token exchange returned no token" >&2; exit 1; fi
        
        echo "::add-mask::$TOKEN"
        echo "::set-output name=trusted_token::$TOKEN"
    